---
layout: default
---
<article class="container prose">
  <h1>{{ page.title }}</h1>
  {%- for item in page.faq %}
  <details{% if forloop.first %} open{% endif %}>
    <summary>{{ item.q }}</summary>
    {{ item.a | markdownify }}
  </details>
  {%- endfor %}
</article>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "inLanguage": "{{ page.lang }}",
  "mainEntity": [
    {%- for item in page.faq %}
    {
      "@type": "Question",
      "name": {{ item.q | jsonify }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | markdownify | strip_html | normalize_whitespace | strip | jsonify }} }
    }{% unless forloop.last %},{% endunless %}
    {%- endfor %}
  ]
}
</script>
